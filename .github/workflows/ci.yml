name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # macOS is the primary target, then Windows, then Linux.
        os: [macos-latest, windows-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.99.1
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Test
        run: cargo test --workspace --locked
        env:
          # The runner images ship Chrome; the viewer smoke test must not skip.
          ANYPROF_REQUIRE_CHROME: "1"
          ANYPROF_SMOKE_ARTIFACTS: ${{ runner.temp }}/web-smoke
      - name: Upload viewer screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: web-smoke-${{ matrix.os }}
          path: ${{ runner.temp }}/web-smoke
          if-no-files-found: ignore
      - name: Build
        run: cargo build --workspace --locked

  msrv:
    name: msrv (Rust 1.88)
    runs-on: ubuntu-latest
    env:
      # Keep in sync with `rust-version` in Cargo.toml. RUSTUP_TOOLCHAIN
      # overrides the 1.99.1 pin in rust-toolchain.toml.
      RUSTUP_TOOLCHAIN: "1.88.0"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.88.0
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check the compiler and rust-version
        shell: bash
        run: |
          rustc --version
          rustc --version | grep -q '^rustc 1\.88\.0 '
          grep -q '^rust-version = "1.88"$' Cargo.toml
      - name: Build
        run: cargo build --workspace --all-targets --locked
      - name: Test
        run: cargo test --workspace --locked
        env:
          ANYPROF_REQUIRE_CHROME: "1"
