name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: ${{ matrix.os }} (Go ${{ matrix.go }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # macOS arm64, then macOS Intel, then Windows, then Linux.
        # macos-latest is arm64. macos-15-intel is x86_64. A green arm64
        # job is not Intel coverage. Go 1.22 keeps the header textStart.
        # Go 1.26 writes that word as zero; both are live-sampled.
        os: [macos-latest, macos-15-intel, windows-latest, ubuntu-latest]
        go: ["1.22.x", "1.26.x"]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.99.1
          components: rustfmt, clippy
      - name: Install the musl target
        if: matrix.os == 'ubuntu-latest'
        # The x86_64 sampler is not compiled for aarch64, so an arm64 musl
        # release build does not catch an x86_64 musl type error.
        run: rustup target add x86_64-unknown-linux-musl
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go }}
      - uses: actions/setup-python@v5
        id: py311
        with:
          python-version: "3.11"
      - uses: actions/setup-python@v5
        id: py312
        with:
          python-version: "3.12"
      - uses: actions/setup-python@v5
        id: py313
        with:
          python-version: "3.13"
      - uses: actions/setup-java@v4
        id: java17
        with:
          distribution: temurin
          java-version: "17"
      - uses: actions/setup-java@v4
        id: java21
        with:
          distribution: temurin
          java-version: "21"
      - uses: actions/setup-java@v4
        id: java25
        with:
          distribution: temurin
          java-version: "25"
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Check x86_64 musl
        if: matrix.os == 'ubuntu-latest'
        # Type-check the release target. musl-gcc is only for the updater's C
        # build script. This does not link the binary or run cargo-dist.
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools
          cargo check --workspace --locked --target x86_64-unknown-linux-musl
        env:
          CC_x86_64_unknown_linux_musl: musl-gcc
      - name: Check CPython offsets against the installed headers
        if: matrix.os == 'ubuntu-latest'
        # The frame walk's constants are checked here, not by cargo test, so
        # the MSRV job does not need a C compiler. anyprof does not change
        # ptrace_scope; this step only reads headers.
        env:
          PY311: ${{ steps.py311.outputs.python-path }}
          PY312: ${{ steps.py312.outputs.python-path }}
          PY313: ${{ steps.py313.outputs.python-path }}
        run: |
          set -eu
          check() {
            inc=$("$1" -c "import sysconfig; print(sysconfig.get_path('include'))")
            test -f "$inc/Python.h"
            test -d "$inc/internal"
            gcc -std=c11 -Wall -Werror -DPy_BUILD_CORE -I"$inc" -I"$inc/internal" \
              -o /tmp/cpython-offsets crates/anyprof-native/tests/cpython_offsets.c
            /tmp/cpython-offsets
          }
          check "$PY311"
          check "$PY312"
          check "$PY313"
      - name: Refuse an unrelated Python read at ptrace_scope 1
        if: matrix.os == 'ubuntu-latest'
        # The image default is 1. This step forces that value if a runner
        # image changes it, then requires the permission error. anyprof does
        # not write the sysctl. The next step sets 0 so the suite can read
        # frames of a process it did not start.
        env:
          ANYPROF_PYTHON_311: ${{ steps.py311.outputs.python-path }}
          ANYPROF_PYTHON_312: ${{ steps.py312.outputs.python-path }}
          ANYPROF_PYTHON_313: ${{ steps.py313.outputs.python-path }}
          ANYPROF_REQUIRE_NATIVE: "1"
        run: |
          set -eu
          scope=$(cat /proc/sys/kernel/yama/ptrace_scope)
          if [ "$scope" != "1" ]; then
            sudo sysctl kernel.yama.ptrace_scope=1
          fi
          echo "ptrace_scope=$(cat /proc/sys/kernel/yama/ptrace_scope)"
          cargo test -p anyprof-python --test live --locked -- --exact supported::unrelated_same_user_read_follows_ptrace_scope
      - name: Refuse an unrelated Java read at ptrace_scope 1
        if: matrix.os == 'ubuntu-latest'
        # Same scope as the Python step. A HotSpot frame read is
        # process_vm_readv. The test double-forks java so this process is
        # not an ancestor. anyprof does not write the sysctl.
        env:
          ANYPROF_REQUIRE_NATIVE: "1"
          ANYPROF_JAVA_17: ${{ steps.java17.outputs.path }}
          ANYPROF_JAVA_21: ${{ steps.java21.outputs.path }}
          ANYPROF_JAVA_25: ${{ steps.java25.outputs.path }}
        run: |
          set -eu
          scope=$(cat /proc/sys/kernel/yama/ptrace_scope)
          if [ "$scope" != "1" ]; then
            sudo sysctl kernel.yama.ptrace_scope=1
          fi
          echo "ptrace_scope=$(cat /proc/sys/kernel/yama/ptrace_scope)"
          cargo test -p anyprof-java --test live --locked -- --exact supported::unrelated_same_user_read_follows_ptrace_scope
      - name: Sample a spawned Python child at ptrace_scope 1
        if: matrix.os == 'ubuntu-latest'
        # Because anyprof spawns the child directly, Yama ptrace_scope 1 allows
        # parent->child process_vm_readv without sudo or lowering ptrace_scope.
        env:
          ANYPROF_REQUIRE_NATIVE: "1"
          ANYPROF_PYTHON_312: ${{ steps.py312.outputs.python-path }}
        run: |
          set -eu
          sudo sysctl kernel.perf_event_paranoid=1
          scope=$(cat /proc/sys/kernel/yama/ptrace_scope)
          if [ "$scope" != "1" ]; then
            sudo sysctl kernel.yama.ptrace_scope=1
          fi
          echo "ptrace_scope=$(cat /proc/sys/kernel/yama/ptrace_scope)"
          cargo test -p anyprof-cli --test spawn_live --locked -- --exact spawn_python_captures_interpreter_frames_as_parent
      - name: Allow per-process perf sampling and Python and Java frame reads
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo sysctl kernel.perf_event_paranoid=1
          sudo sysctl kernel.kptr_restrict=0
          # process_vm_readv uses ptrace attach. Scope 1 lets a parent read
          # its child and refuses the anyprof process, which is not the
          # parent of an already-running target. perf_event_open does not use
          # that check. This job sets scope 0 for the Python and Java frame
          # reads after the denial steps above. anyprof itself does not change it.
          sudo sysctl kernel.yama.ptrace_scope=0
          echo "perf_event_paranoid=$(cat /proc/sys/kernel/perf_event_paranoid)"
          echo "kptr_restrict=$(cat /proc/sys/kernel/kptr_restrict)"
          echo "ptrace_scope=$(cat /proc/sys/kernel/yama/ptrace_scope 2>/dev/null || echo absent)"
      - name: Test
        run: cargo test --workspace --locked
        env:
          # The runner images ship Chrome; the viewer smoke test must not skip.
          ANYPROF_REQUIRE_CHROME: "1"
          ANYPROF_SMOKE_ARTIFACTS: ${{ runner.temp }}/web-smoke
          # macOS samples C++, Rust, and Go under sudo. Ubuntu samples them
          # after the sysctl step. Windows samples them as the same user. A
          # skip is a failure. The MSRV job does not set this and does not
          # change sysctls. musl is cargo check only, above. Go fixtures use
          # the toolchain from setup-go. Python fixtures use the three
          # setup-python interpreters and Temurin 17, 21, and 25. They run
          # inside this job, so each Go version also samples 3.11, 3.12, 3.13,
          # and those three HotSpot releases. The MSRV job does not install a
          # JDK and does not set ANYPROF_REQUIRE_NATIVE. A JDK that happens to
          # be on that image may skip a documented permission denial. This
          # matrix must not.
          ANYPROF_REQUIRE_NATIVE: "1"
          ANYPROF_JAVA_17: ${{ steps.java17.outputs.path }}
          ANYPROF_JAVA_21: ${{ steps.java21.outputs.path }}
          ANYPROF_JAVA_25: ${{ steps.java25.outputs.path }}
          ANYPROF_PYTHON_311: ${{ steps.py311.outputs.python-path }}
          ANYPROF_PYTHON_312: ${{ steps.py312.outputs.python-path }}
          ANYPROF_PYTHON_313: ${{ steps.py313.outputs.python-path }}
      - name: Upload viewer screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: web-smoke-${{ matrix.os }}-go-${{ matrix.go }}
          path: ${{ runner.temp }}/web-smoke
          if-no-files-found: ignore
      - name: Build
        run: cargo build --workspace --locked

  msrv:
    name: msrv (Rust 1.88)
    runs-on: ubuntu-latest
    env:
      # Keep in sync with `rust-version` in Cargo.toml. RUSTUP_TOOLCHAIN
      # overrides the 1.99.1 pin in rust-toolchain.toml.
      RUSTUP_TOOLCHAIN: "1.88.0"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.88.0
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check the compiler and rust-version
        shell: bash
        run: |
          rustc --version
          rustc --version | grep -q '^rustc 1\.88\.0 '
          grep -q '^rust-version = "1.88"$' Cargo.toml
      - name: Build
        run: cargo build --workspace --all-targets --locked
      - name: Test
        run: cargo test --workspace --locked
        env:
          ANYPROF_REQUIRE_CHROME: "1"
