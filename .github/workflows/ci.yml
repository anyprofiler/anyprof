name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # macOS arm64, then macOS Intel, then Windows, then Linux.
        # macos-latest is arm64. macos-15-intel is x86_64. A green arm64
        # job is not Intel coverage.
        os: [macos-latest, macos-15-intel, windows-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.99.1
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Allow per-process perf sampling
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo sysctl kernel.perf_event_paranoid=1
          sudo sysctl kernel.kptr_restrict=0
          # ptrace_scope stays at the image default. The live tests sample
          # their own children, which scope 1 allows, and expect a same-user
          # orphan to be refused when that scope is 1 or higher.
          echo "perf_event_paranoid=$(cat /proc/sys/kernel/perf_event_paranoid)"
          echo "kptr_restrict=$(cat /proc/sys/kernel/kptr_restrict)"
          echo "ptrace_scope=$(cat /proc/sys/kernel/yama/ptrace_scope 2>/dev/null || echo absent)"
      - name: Test
        run: cargo test --workspace --locked
        env:
          # The runner images ship Chrome; the viewer smoke test must not skip.
          ANYPROF_REQUIRE_CHROME: "1"
          ANYPROF_SMOKE_ARTIFACTS: ${{ runner.temp }}/web-smoke
          # macOS samples under sudo. Ubuntu samples after the sysctl step.
          # Windows samples a same-user process. A skip is a failure.
          # The MSRV job does not set this and does not change sysctls.
          ANYPROF_REQUIRE_NATIVE: "1"
      - name: Upload viewer screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: web-smoke-${{ matrix.os }}
          path: ${{ runner.temp }}/web-smoke
          if-no-files-found: ignore
      - name: Build
        run: cargo build --workspace --locked

  msrv:
    name: msrv (Rust 1.88)
    runs-on: ubuntu-latest
    env:
      # Keep in sync with `rust-version` in Cargo.toml. RUSTUP_TOOLCHAIN
      # overrides the 1.99.1 pin in rust-toolchain.toml.
      RUSTUP_TOOLCHAIN: "1.88.0"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.88.0
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check the compiler and rust-version
        shell: bash
        run: |
          rustc --version
          rustc --version | grep -q '^rustc 1\.88\.0 '
          grep -q '^rust-version = "1.88"$' Cargo.toml
      - name: Build
        run: cargo build --workspace --all-targets --locked
      - name: Test
        run: cargo test --workspace --locked
        env:
          ANYPROF_REQUIRE_CHROME: "1"
