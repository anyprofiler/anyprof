name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: ${{ matrix.os }} (Go ${{ matrix.go }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # macOS arm64, then macOS Intel, then Windows, then Linux.
        # macos-latest is arm64. macos-15-intel is x86_64. A green arm64
        # job is not Intel coverage. Go 1.22 keeps the header textStart.
        # Go 1.26 writes that word as zero; both are live-sampled.
        os: [macos-latest, macos-15-intel, windows-latest, ubuntu-latest]
        go: ["1.22.x", "1.26.x"]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.99.1
          components: rustfmt, clippy
      - name: Install the musl target
        if: matrix.os == 'ubuntu-latest'
        # The x86_64 sampler is not compiled for aarch64, so an arm64 musl
        # release build does not catch an x86_64 musl type error.
        run: rustup target add x86_64-unknown-linux-musl
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go }}
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Check x86_64 musl
        if: matrix.os == 'ubuntu-latest'
        # Type-check the release target. musl-gcc is only for the updater's C
        # build script. This does not link the binary or run cargo-dist.
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools
          cargo check --workspace --locked --target x86_64-unknown-linux-musl
        env:
          CC_x86_64_unknown_linux_musl: musl-gcc
      - name: Allow per-process perf sampling
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo sysctl kernel.perf_event_paranoid=1
          sudo sysctl kernel.kptr_restrict=0
          # ptrace_scope stays at the image default. Scope 1 limits ptrace
          # attach. perf_event_open does not use that check, so the live test
          # samples an unrelated same-user process at the image's scope.
          echo "perf_event_paranoid=$(cat /proc/sys/kernel/perf_event_paranoid)"
          echo "kptr_restrict=$(cat /proc/sys/kernel/kptr_restrict)"
          echo "ptrace_scope=$(cat /proc/sys/kernel/yama/ptrace_scope 2>/dev/null || echo absent)"
      - name: Test
        run: cargo test --workspace --locked
        env:
          # The runner images ship Chrome; the viewer smoke test must not skip.
          ANYPROF_REQUIRE_CHROME: "1"
          ANYPROF_SMOKE_ARTIFACTS: ${{ runner.temp }}/web-smoke
          # macOS samples C++, Rust, and Go under sudo. Ubuntu samples them
          # after the sysctl step. Windows samples them as the same user. A
          # skip is a failure. The MSRV job does not set this and does not
          # change sysctls. musl is cargo check only, above. Go fixtures use
          # the toolchain from setup-go.
          ANYPROF_REQUIRE_NATIVE: "1"
      - name: Upload viewer screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: web-smoke-${{ matrix.os }}-go-${{ matrix.go }}
          path: ${{ runner.temp }}/web-smoke
          if-no-files-found: ignore
      - name: Build
        run: cargo build --workspace --locked

  msrv:
    name: msrv (Rust 1.88)
    runs-on: ubuntu-latest
    env:
      # Keep in sync with `rust-version` in Cargo.toml. RUSTUP_TOOLCHAIN
      # overrides the 1.99.1 pin in rust-toolchain.toml.
      RUSTUP_TOOLCHAIN: "1.88.0"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.88.0
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check the compiler and rust-version
        shell: bash
        run: |
          rustc --version
          rustc --version | grep -q '^rustc 1\.88\.0 '
          grep -q '^rust-version = "1.88"$' Cargo.toml
      - name: Build
        run: cargo build --workspace --all-targets --locked
      - name: Test
        run: cargo test --workspace --locked
        env:
          ANYPROF_REQUIRE_CHROME: "1"
