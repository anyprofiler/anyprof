<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>anyprof</title>
<link rel="stylesheet" href="app.css">
</head>
<body>
<div id="app" class="app" data-testid="app">
  <header class="toolbar" data-testid="toolbar">
    <div class="toolbar-title">
      <div class="brand">anyprof</div>
      <div class="title-block">
        <div id="file-name" class="file-name" data-testid="file-name"></div>
        <div id="meta" class="meta" data-testid="meta"></div>
      </div>
    </div>
    <div class="segment theme" role="group" aria-label="Appearance">
      <button type="button" data-theme="system" data-testid="theme-system">System</button>
      <button type="button" data-theme="light" data-testid="theme-light">Light</button>
      <button type="button" data-theme="dark" data-testid="theme-dark">Dark</button>
    </div>
  </header>
  <section id="overview" class="overview" data-testid="overview"></section>
  <div id="split-overview" class="splitter splitter-y" role="separator" aria-orientation="horizontal" aria-label="Resize timeline" tabindex="0"></div>
  <div class="workspace">
    <section class="main">
      <div class="pane-bar">
        <div class="segment tabs" role="tablist" aria-label="Profile views">
          <button type="button" role="tab" id="tab-tree" data-pane="tree" aria-selected="true" data-testid="tab-tree">Call Tree</button>
          <button type="button" role="tab" id="tab-flame" data-pane="flame" aria-selected="false" data-testid="tab-flame">Flame Graph</button>
          <button type="button" role="tab" id="tab-functions" data-pane="functions" aria-selected="false" data-testid="tab-functions">Functions</button>
          <button type="button" role="tab" id="tab-source" data-pane="source" aria-selected="false" data-testid="tab-source">Source</button>
        </div>
        <label class="search">
          <span class="sr">Search</span>
          <input id="search" type="text" placeholder="Search symbol or file" data-testid="search" autocomplete="off" spellcheck="false">
        </label>
        <div class="segment tools">
          <button type="button" id="invert" data-testid="invert" aria-pressed="false">Invert</button>
          <button type="button" id="hide-system" data-testid="hide-system" aria-pressed="false" disabled>Hide system</button>
        </div>
        <div id="time-filter" class="time-filter" data-testid="time-filter-badge" hidden></div>
        <div id="tracks" class="tracks" data-testid="tracks"></div>
      </div>
      <div id="pane" class="pane" data-testid="pane" tabindex="0" aria-label="Profile table. Arrow keys move, left and right collapse and expand, Enter opens source, slash searches, i inverts, escape clears or resets zoom."></div>
    </section>
    <div id="split-inspector" class="splitter splitter-x" role="separator" aria-orientation="vertical" aria-label="Resize detail" tabindex="0"></div>
    <aside class="inspector" data-testid="inspector">
      <div class="inspector-section inspector-heavy">
        <div class="heavy-head">
          <h2 id="heaviest-label" data-testid="heaviest-label">Heaviest Stack Trace</h2>
          <span id="heaviest-by" class="heavy-by">by Weight</span>
        </div>
        <p id="heaviest-scope" class="scope" data-testid="heaviest-scope"></p>
        <ol id="heaviest" data-testid="heaviest"></ol>
      </div>
      <div class="inspector-section inspector-detail">
        <div class="detail-head">
          <h2>Selected function</h2>
          <button type="button" id="open-source-btn" class="mini" data-testid="open-source-btn" hidden>Source</button>
        </div>
        <dl id="detail" data-testid="detail"></dl>
      </div>
    </aside>
  </div>
</div>
<script src="app.js"></script>
</body>
</html>
