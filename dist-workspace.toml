[workspace]
members = ["cargo:."]

# Config for 'dist'
[dist]
# The preferred dist version to use in CI (Cargo.toml SemVer syntax)
cargo-dist-version = "0.33.1"
# CI backends to support
ci = "github"
# The installers to generate for each app.
# TODO(installers): Homebrew and npm are intentionally off until a tap and an npm scope exist.
# installers = ["shell", "powershell", "homebrew", "npm"]
installers = ["shell", "powershell"]
# Target platforms to build apps for (Rust target-triple syntax).
# Priority is macOS (arm64, then x64), Windows, then Linux. musl builds install
# musl-tools in CI. Runners are pinned below so plan/host/global jobs and the
# build matrix stay off deprecated ubuntu-22.04 and macos-14 images.
targets = ["aarch64-apple-darwin", "x86_64-apple-darwin", "x86_64-pc-windows-msvc", "x86_64-unknown-linux-gnu", "aarch64-unknown-linux-gnu", "x86_64-unknown-linux-musl", "aarch64-unknown-linux-musl"]
# Path that installers should place binaries in
install-path = "CARGO_HOME"
# Where to host releases
hosting = "github"
# Whether to install an updater program
install-updater = false
# Third-party licenses for the speedscope build embedded by `anyprof view`.
include = [
    "crates/anyprof-web/vendor/licenses/LICENSE-speedscope.txt",
    "crates/anyprof-web/vendor/licenses/LICENSE-source-code-pro.md",
]

# GitHub-hosted runners. `global` is plan, installers, host, and announce.
# x86_64-apple-darwin stays on the Intel image dist already selects
# (macos-15-intel) so that target is a native build. Windows keeps dist's
# default (windows-2022).
[dist.github-custom-runners]
global = "ubuntu-24.04"
aarch64-apple-darwin = "macos-15"
x86_64-apple-darwin = "macos-15-intel"
x86_64-unknown-linux-gnu = "ubuntu-24.04"
aarch64-unknown-linux-gnu = "ubuntu-24.04-arm"
x86_64-unknown-linux-musl = "ubuntu-24.04"
aarch64-unknown-linux-musl = "ubuntu-24.04-arm"
