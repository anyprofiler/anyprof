[workspace]
members = ["cargo:."]

# Config for 'dist'
[dist]
# The preferred dist version to use in CI (Cargo.toml SemVer syntax)
cargo-dist-version = "0.33.1"
# CI backends to support
ci = "github"
# The installers to generate for each app.
# TODO(installers): Homebrew and npm are intentionally off until a tap and an npm scope exist.
# installers = ["shell", "powershell", "homebrew", "npm"]
installers = ["shell", "powershell"]
# Target platforms to build apps for (Rust target-triple syntax).
# Priority is macOS (arm64, then x64), Windows, then Linux. ARM Linux uses the
# native ubuntu-22.04-arm runner. musl builds install musl-tools in CI.
targets = ["aarch64-apple-darwin", "x86_64-apple-darwin", "x86_64-pc-windows-msvc", "x86_64-unknown-linux-gnu", "aarch64-unknown-linux-gnu", "x86_64-unknown-linux-musl", "aarch64-unknown-linux-musl"]
# Path that installers should place binaries in
install-path = "CARGO_HOME"
# Where to host releases
hosting = "github"
# Whether to install an updater program
install-updater = false
