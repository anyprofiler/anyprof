[workspace]
resolver = "2"
members = [
    "crates/anyprof-core",
    "crates/anyprof-cdp",
    "crates/anyprof-export",
    "crates/anyprof-node",
    "crates/anyprof-browser",
    "crates/anyprof-native",
    "crates/anyprof-go",
    "crates/anyprof-web",
    "crates/anyprof-cli",
]

[workspace.package]
version = "0.1.2"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/anyprofiler/anyprof"
homepage = "https://github.com/anyprofiler/anyprof"
authors = ["anyprofiler contributors"]
rust-version = "1.88"
description = "Capture CPU profiles from any running process, no code changes or restarts needed."

[workspace.dependencies]
anyprof-core = { path = "crates/anyprof-core" }
anyprof-cdp = { path = "crates/anyprof-cdp" }
anyprof-native = { path = "crates/anyprof-native" }
anyprof-node = { path = "crates/anyprof-node" }
anyprof-browser = { path = "crates/anyprof-browser" }
anyprof-go = { path = "crates/anyprof-go" }
anyprof-export = { path = "crates/anyprof-export" }
anyprof-web = { path = "crates/anyprof-web" }
tungstenite = { version = "0.30", default-features = false, features = ["handshake"] }
anyhow = "1"
axoupdater = "0.10.3"
clap = { version = "4.5", features = ["derive"] }
ctrlc = { version = "3.4", features = ["termination"] }
flate2 = { version = "1.0.35", default-features = false, features = ["rust_backend"] }
getrandom = "0.4"
humantime = "2.1"
include_dir = "0.7.4"
jiff = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tiny_http = "0.12"
tokio = { version = "1.48", default-features = false, features = ["rt", "net", "time"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
# `hardened` refuses anything but http(s) URLs.
webbrowser = { version = "1.2", features = ["hardened"] }

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
